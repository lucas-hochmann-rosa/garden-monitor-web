name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valores fake só para o build passar no CI (nenhuma rota é executada aqui).
          DATABASE_URL: 'postgresql://user:pass@localhost:5432/gardenmonitor'
          SESSION_SECRET: 'ci-build-placeholder-secret-not-used-in-runtime'
          DEVICE_API_KEY: 'ci-build-placeholder-key'
